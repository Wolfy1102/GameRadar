<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Deal Radar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 Steam Deal Radar</h1>
        <p>Finde die besten Steam-Angebote!</p>
    </header>

    <main>
        <input id="search" type="text" placeholder="Spiel suchen...">

        <select id="region">
            <option value="de">Deutschland</option>
            <option value="us">USA</option>
            <option value="gb">Großbritannien</option>
            <option value="fr">Frankreich</option>
        </select>

        <button id="searchButton">Spiele suchen</button>

        <section id="games">
            <p>Deine Angebote erscheinen hier.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
