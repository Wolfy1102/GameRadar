<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Konto-Hilfe · GameRadar</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/icon.svg"></head>
<body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><span></span><i></i></span><span>GAME<span>RADAR</span></span></a><div class="account-area"><a class="login-button" href="/">ZURÜCK ZUM RADAR</a></div></header>
<main class="account-page"><div class="eyebrow">ACCOUNT SUPPORT</div><h1 class="page-title">Konto <span>Hilfe.</span></h1><section class="profile-panel account-action-panel"><div id="accountActionStatus" role="status">Lade …</div><form id="forgotForm" class="profile-form" hidden><h2>Passwort vergessen?</h2><p class="section-note">Wir senden dir einen zeitlich begrenzten Link, falls ein bestätigtes Konto zu der Adresse existiert.</p><label>E-Mail-Adresse<input id="forgotEmail" type="email" maxlength="254" required autocomplete="email"></label><button class="primary-action" type="submit">Link anfordern</button></form><form id="resetForm" class="profile-form" hidden><h2>Neues Passwort festlegen</h2><label>Neues Passwort<input id="newPassword" type="password" minlength="10" maxlength="200" required autocomplete="new-password"></label><label>Passwort wiederholen<input id="confirmPassword" type="password" minlength="10" maxlength="200" required autocomplete="new-password"></label><button class="primary-action" type="submit">Passwort speichern</button></form></section></main><script src="/account.js"></script></body></html>
